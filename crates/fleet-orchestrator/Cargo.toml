[package]
name = "fleet-orchestrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent Fleet project orchestration control plane (pure logic)"
default-run = "fleet-orchestrator"

[[bin]]
name = "fleet-orchestrator"
path = "src/main.rs"

[[bin]]
name = "fleet-worker"
path = "src/bin/fleet-worker.rs"

[dependencies]
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dotenvy = { workspace = true }
subtle = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
fleet-db = { workspace = true }
fleet-operator = { path = "../fleet-operator" }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
kube = { version = "0.98", default-features = true, features = ["client", "derive"] }
# kube→educe→enum-ordinalize 4.4+ needs rustc 1.89; stay on 1.88 with the operator.
enum-ordinalize = "=4.3.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
