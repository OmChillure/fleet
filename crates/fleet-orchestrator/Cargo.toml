[package]
name = "fleet-orchestrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent Fleet project orchestration control plane (library; served by fleet-server)"

[dependencies]
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dotenvy = { workspace = true }
subtle = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
fleet-db = { workspace = true }
fleet-integrations = { workspace = true }
agent-fleet-contracts = { path = "../agent-fleet-contracts" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
fleet-driver = { path = "../fleet-driver" }
