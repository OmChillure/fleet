[application]
name = "fleet-ui"
default_platform = "web"

[web.app]
title = "Agent Fleet"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
style = []
script = []

[web.resource.dev]
style = []
script = []

# Forward /api/* to fleet-server so cookies are first-party on :3030 (reload-safe).
# Start the API first: `cargo run` → http://127.0.0.1:8080
[[web.proxy]]
backend = "http://127.0.0.1:8080/api/"
