[package]
name = "fleet-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agent Fleet web UI (Dioxus)"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
fleet-chat-md = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Storage", "StorageEvent", "Location", "MessageEvent", "Event", "EventTarget", "Navigator", "Clipboard", "Document", "HtmlDocument", "HtmlTextAreaElement", "HtmlElement", "Element", "Node"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[features]
default = ["web"]
web = ["dioxus/web"]
