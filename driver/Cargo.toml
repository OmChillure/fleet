[package]
name = "agent-fleet-driver"
version = "0.1.0"
edition = "2021"
description = "TUI control plane for running coding agents over ACP"
license = "Apache-2.0"
rust-version = "1.88"

[[bin]]
name = "agent-fleet-driver"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
