# Map kind extraPortMappings (infra/kind.yaml) onto UI + API.
apiVersion: v1
kind: Service
metadata:
  name: api-node
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
    app.kubernetes.io/name: fleet-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fleet-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: ui-node
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
    app.kubernetes.io/name: fleet-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fleet-ui
  ports:
    - name: http
      port: 3030
      targetPort: http
      nodePort: 30303
