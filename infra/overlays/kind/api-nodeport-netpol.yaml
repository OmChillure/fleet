# kind extraPortMappings hit the API as node/host traffic, not as an in-ns pod.
# The base api-ingress netpol only allows UI/operator/sandbox pods — host :8080
# would TCP-connect via docker-proxy then hang. UI already allows any source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-nodeport
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
