apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-operator
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
    app.kubernetes.io/name: fleet-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-fleet
        app.kubernetes.io/name: fleet-operator
    spec:
      serviceAccountName: fleet-operator
      containers:
        - name: operator
          image: agent-fleet-operator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: agent-fleet
            - name: WORKER_IMAGE
              value: agent-fleet-api:local
            - name: API_SERVICE_URL
              value: http://api.agent-fleet.svc.cluster.local:8080
            - name: API_NAMESPACE
              value: agent-fleet
            - name: API_POD_LABEL
              value: fleet-api
            - name: RUST_LOG
              value: info,kube=warn
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
