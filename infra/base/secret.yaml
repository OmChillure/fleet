# Dev-only credentials. Replace before any non-local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
type: Opaque
stringData:
  POSTGRES_USER: fleet
  POSTGRES_PASSWORD: fleet
  POSTGRES_DB: fleet
  DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable
  JWT_SECRET: dev-change-me-to-a-long-random-secret-at-least-32-chars
