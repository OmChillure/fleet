# Control-plane traffic: postgres ← api; api ← ui + operator + sandboxes; ui ← clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fleet-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox
        - podSelector: {} # port-forward / in-ns debug
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-ingress
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleet-ui
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 3030
