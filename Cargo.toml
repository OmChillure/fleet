[package]
name = "fleet-orchestrator"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Agent Fleet project orchestration control plane (pure logic)"
license = "UNLICENSED"
default-run = "fleet-orchestrator"

[[bin]]
name = "fleet-orchestrator"
path = "src/main.rs"

[dependencies]
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
subtle = "2.6"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3.15"
