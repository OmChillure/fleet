# Operator-facing versions of the two runner binaries.
# Host and driver versions are independent. Each has its own parent hash
# of per-OS child hashes (linux-x86_64, linux-aarch64, windows-x86_64).
#
#   [versions]  — written into staged packages and reported by the bins
#   [verify]    — what the control plane uses to decide current vs behind
#   [release.fleet-host] / [release.fleet-driver]
#       version  — must match that bin's [versions] / [verify]
#       parent   — sha256 of sorted "platform=hex\\n" child lines
#       <os>     — sha256 of that OS build
#
# <os>-rev is the per-OS patch. Display is 0.0.3 when rev=0, 0.0.3.1 when
# rev=1. A Windows-only fix bumps windows-x86_64-rev only. Bumping the line
# version to 0.0.4 resets every OS rev to 0.
#
# If a staged binary's sha256 is not registered, check/deploy fail. For one
# OS: bump that <os>-rev, restage that OS, register. For all OS: bump
# [versions] and [release.BIN].version, restage, register.
#
#   fleet-host   — pair / heartbeat / lease / official CLI chat
#   fleet-driver — process worker (ACP)

[versions]
fleet-host = "0.0.3"
fleet-driver = "0.0.3"

[verify]
fleet-host = "0.0.3"
fleet-driver = "0.0.3"

[release.fleet-host]
