parent = "09342a6ed13789e4116004a4338fdb9ed61d41ddb33a9bec3bde389a5fcd5cb2"
linux-x86_64 = "6612f96e279d5ad9fb90a4d19637165555af243b2ba1c875eb4885776adcfba6"
linux-x86_64-rev = 1
linux-aarch64 = "0967595cf78ff78a106d0efddeb8fdb335e6b9c8f1f146fde110d8ce87d4be7a"
linux-aarch64-rev = 1
windows-x86_64 = "6faafc4a2681c28d48f1a5692f1fe6f7da6b18711498366e7fdeee1c1fb21315"
windows-x86_64-rev = 1

