# Operator-facing versions of the two runner binaries.
# The same number is baked into every OS build of that source, so Linux and
# Windows can be compared. File hashes still prove the bytes on one OS.
#
#   [versions]  — written into staged packages and reported by the bins
#   [verify]    — what the control plane uses to decide current vs behind
#   [release]   — parent hash of the children below (shipped OS × bin)
#
# Parent = sha256 of sorted "platform/bin=hex\\n" lines (bin name without .exe).
# If a staged binary's sha256 is not in this table for [release].version,
# check-worker-dist.sh / deploy fail. Bump [versions]+[verify]+[release].version
# and run scripts/register-runner-release.sh after restaging.
#
#   fleet-host   — pair / heartbeat / lease / official CLI chat
#   fleet-driver — process worker (ACP)
#
# Shipped OS (not musl / armv7 / darwin): linux-x86_64, linux-aarch64, windows-x86_64.

[versions]
fleet-host = "0.0.2"
fleet-driver = "0.0.2"

[verify]
fleet-host = "0.0.2"
fleet-driver = "0.0.2"

[release]
version = "0.0.2"
parent = "f43ee5d432643535e4bc886a029fa9c51b812e1bd54a2a6a26576bf05eda8aae"

