# fleet-ui — static WASM + reverse-proxy /api → fleet-server
# Browser origin is :3030; cookies stay first-party (same as dx serve proxy).

server {
    listen 3030;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API (auth cookies, integrations, personas, fleet, …)
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        # Long enough for slow local API cold starts
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Optional: expose API health through UI origin for debugging
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA: Dioxus client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively if present
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
