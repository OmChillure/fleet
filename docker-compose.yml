# Postgres for Agent Fleet orchestration (local dev).
# MVP: run exactly ONE fleet-orchestrator against this database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5433:5432"
    volumes:
      - fleet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fleet_pg:
