# Agent Fleet — full stack (Postgres + API + UI + zenohd + fleet-host)
#
#   docker compose up -d postgres          # DB only — does not need FLEET_GIT_SHA
#   FLEET_GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
#
#   API:  http://localhost:8080
#   UI:   http://localhost:3030   (nginx; /api proxied to API)
#   DB:   postgres://fleet:fleet@localhost:5433/fleet
#
# Compose interpolates the whole file even for `up postgres`, so FLEET_GIT_SHA
# must not be a required (${VAR:?}) interpolation. Empty SHA fails at
# `docker build` (Dockerfile `test -n`), not at starting Postgres.
# Open the UI at http://localhost:3030 (prefer localhost for cookies).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5433:5432"
    volumes:
      - fleet_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FLEET_GIT_SHA: ${FLEET_GIT_SHA:-}
    image: agent-fleet-api:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable
      JWT_SECRET: dev-change-me-to-a-long-random-secret-at-least-32-chars
      HOST: "0.0.0.0"
      PORT: "8080"
      # UI is served on :3030 (docker ui service or host dx serve)
      CORS_ORIGINS: http://localhost:3030,http://127.0.0.1:3030
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
      API_PUBLIC_BASE: http://localhost:8080
      # Assignment treats a loopback URL as "only this machine." A Mac runner
      # paired to the Compose API is a different hostname, so set this to the
      # LAN address (ORCHESTRATOR_PUBLIC_URL=http://192.168.x.x:8080).
      ORCHESTRATOR_PUBLIC_URL: ${ORCHESTRATOR_PUBLIC_URL:-http://localhost:8080}
      UI_PUBLIC_BASE: http://localhost:3030
      DATA_DIR: /data
      FLEET_BOOTSTRAP_SECRET: ${FLEET_BOOTSTRAP_SECRET:-}
      SIGNUP_TOKEN: ${SIGNUP_TOKEN:-}
      ZENOH_LOCATOR: tcp/zenohd:7447
      # localhost inside this container is not the Mac. host.docker.internal
      # reaches the published Gitea port. The same name must resolve in the browser.
      GITEA_BASE_URL: ${GITEA_BASE_URL:-http://host.docker.internal:3033}
      GITEA_CLIENT_ID: ${GITEA_CLIENT_ID:-}
      GITEA_CLIENT_SECRET: ${GITEA_CLIENT_SECRET:-}
      RUST_LOG: info,sqlx=warn,tower_http=info
      # ADMIN_TOKEN: dev-admin-token-change-me
    volumes:
      - fleet_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 40s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        FLEET_GIT_SHA: ${FLEET_GIT_SHA:-}
    image: agent-fleet-ui:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3030:3030"
    # nginx conf hard-codes proxy_pass http://api:8080 — uses compose DNS name "api"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3030/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  zenohd:
    image: eclipse/zenoh:1.2.1
    command: ["--listen", "tcp/0.0.0.0:7447"]

  host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FLEET_GIT_SHA: ${FLEET_GIT_SHA:-}
    image: agent-fleet-api:local
    depends_on:
      api:
        condition: service_healthy
      zenohd:
        condition: service_started
    command: ["fleet-host", "run"]
    environment:
      FLEET_CONTROL_PLANE_URL: http://api:8080
      FLEET_HOST_CONFIG_DIR: /data/host
      FLEET_HOST_RUN_HOST: "true"
      FLEET_HOST_RUN_CONTAINER: "false"
      FLEET_HARNESS: mock
      FLEET_BOOTSTRAP_SECRET: ${FLEET_BOOTSTRAP_SECRET:-}
      ZENOH_LOCATOR: tcp/zenohd:7447
      RUST_LOG: info
    volumes:
      - fleet_host:/data/host
    healthcheck:
      disable: true

  gitea:
    image: gitea/gitea:1.27.3
    ports:
      - "3033:3000"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3033/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__START_SSH_SERVER: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: fleet-gitea-dev-secret-key-32b
      GITEA__oauth2__JWT_SECRET: fleet-gitea-dev-jwt-secret-32bytes
    volumes:
      - gitea_data:/data

volumes:
  fleet_pg:
  fleet_data:
  fleet_host:
  gitea_data:
