# Path prefix → record / human-test scenes.
# A changed file hits every matching prefix (union). That is the
# direct + indirect map: a db repo, contract, or shared chrome change
# pulls the surfaces that consume it.
#
# Prefix match: exact path, or path == prefix, or path starts with prefix+"/".
# Keep prefixes tight. Do not map all of fleet-db or fleet-ui to every scene.

[[rule]]
paths = [
  "crates/fleet-ui/src/pages/home",
]
scenes = ["landing"]
pauses = ["Landing"]

[[rule]]
paths = [
  "crates/fleet-auth",
  "crates/fleet-db/src/repos/workspaces.rs",
  "crates/fleet-db/src/models/session.rs",
  "crates/fleet-ui/src/pages/auth",
]
scenes = ["auth", "workspace"]
pauses = ["Signup", "Login", "Login wall", "Workspace switcher"]

[[rule]]
paths = [
  "crates/fleet-ui/src/components/sidebar.rs",
  "crates/fleet-ui/src/components/app_shell.rs",
  "crates/fleet-ui/src/main.rs",
]
scenes = ["shell"]
pauses = ["Sidebar", "User menu"]

[[rule]]
paths = [
  "crates/fleet-server/src/lib.rs",
  "crates/fleet-server/src/main.rs",
  "crates/fleet-server/src/config.rs",
]
